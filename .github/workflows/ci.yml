name: My CI

on: 
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
    -  name: first
       uses: actions/checkout@v4

    -  name: second
       uses: actions/setup-python@v5
       with: 
         python-version: "3.12"

    -  name: install dependencies
       run: pip install -r requirements.txt
    -  name: run test
       run: pytest
