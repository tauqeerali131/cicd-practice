name: My CI

on: 
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    -  name: first
       uses: actions/checkout@v4

    -  name: second
       uses: actions/setup-python@v5
       with: 
         python-version: "3.12"

    -  name: install dependencies
       run: pip install -r requirements.txt
    -  name: run test
       run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    -  name: checkout the code
       uses: actions/checkout@v4

    -  name: build
       run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-practice:v1 .

    -  name: run
       run: docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/cicd-practice:v1
    -  name: login docker
       uses: docker/login-action@v3
       with:
         username: ${{ secrets.DOCKERHUB_USERNAME }}
         password: ${{ secrets.DOCKERHUB_TOKEN }}
    -  name: image push
       run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicd-practice:v1
